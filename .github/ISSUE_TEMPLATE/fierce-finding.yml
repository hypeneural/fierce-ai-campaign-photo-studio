name: "FIERCE / Finding"
description: "Reproducible technical finding from a human or validation agent"
title: "[FIERCE][FINDING] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Start comments with `AGENT: CHATGPT`, `AGENT: ANTIGRAVITY`, or `AGENT: HUMAN`.
        Never paste credentials, tokens, private keys, cookies, or full environment dumps containing secrets.
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "local / GitHub Actions / Plesk staging / production"
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Validation date
      placeholder: "YYYY-MM-DD"
    validations:
      required: true
  - type: textarea
    id: observation
    attributes:
      label: Observation
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Exact reproduction commands/actions
      render: shell
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence / relevant output
      description: Redact secrets and personal data.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact
    validations:
      required: true
  - type: textarea
    id: action
    attributes:
      label: Proposed next action
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Action risk
      options:
        - Read-only
        - Reversible change
        - Potentially destructive — human approval required
    validations:
      required: true
