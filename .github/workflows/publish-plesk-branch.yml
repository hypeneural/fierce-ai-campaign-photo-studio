name: Publish Plesk Branch

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: plesk-deployment-branch
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --omit=dev
      - name: Build and verify static export
        run: |
          npm run audit
          npm run verify:static
      - name: Inject deployment metadata
        run: |
          cat <<EOF > out/deploy.json
          {
            "sourceSha": "${GITHUB_SHA}",
            "builtAt": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "deployment": "static-export",
            "service": "campaign-photo-studio"
          }
          EOF
      - name: Publish generated static files to plesk branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cp -a out/. "$tmp/"
          cd "$tmp"

          # Verify forbidden artifacts do not exist in deployment tree
          for forbidden in package.json package-lock.json README.md AGENTS.md src docs prompts .env .git; do
            if [ -e "$forbidden" ]; then
              echo "Error: forbidden file/folder '$forbidden' found in deployment artifact!" >&2
              exit 1
            fi
          done

          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b plesk
          git add -A
          git commit -m "deploy: ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin plesk
